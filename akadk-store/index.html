<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKADK Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000000;
            color: #fff;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Canvas background */
        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Content container */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
            background: #000000;
            border: 3px solid #ff0000;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8), 
                        0 0 80px rgba(255, 0, 0, 0.4),
                        inset 0 0 30px rgba(255, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        /* Logo */
        .logo-container {
            margin-bottom: 25px;
        }

        .logo-image {
            max-width: 100px;
            height: auto;
            filter: drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 40px #ff0000) brightness(1.1);
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { 
                filter: drop-shadow(0 0 20px #ff0000) drop-shadow(0 0 40px #ff0000) brightness(1.1);
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 30px #ff0000) drop-shadow(0 0 60px #ff0000) brightness(1.3);
                transform: scale(1.05);
            }
        }

        /* Title */
        h1 {
            font-size: 36px;
            color: #ff0000;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
        }

        /* Description */
        .description {
            font-size: 14px;
            color: #cccccc;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Discord Button */
        .discord-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background: #000000;
            color: #ff0000;
            text-decoration: none;
            border-radius: 8px;
            border: 2px solid #ff0000;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6),
                        inset 0 0 15px rgba(255, 0, 0, 0.1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .discord-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 0, 0, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .discord-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 50px rgba(255, 0, 0, 1),
                        0 0 80px rgba(255, 0, 0, 0.6),
                        inset 0 0 20px rgba(255, 0, 0, 0.3);
            background: rgba(255, 0, 0, 0.1);
        }

        .discord-btn:hover::before {
            left: 100%;
        }

        .discord-btn:active {
            transform: scale(0.95);
        }

        .discord-icon {
            width: 24px;
            height: 24px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 127.14 96.36"><path fill="%23ff0000" d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A99.68,99.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36a77.7,77.7,0,0,0,6.89-11.18,68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a77.15,77.15,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.22,77,77,0,0,0,6.89,11.1,106.51,106.51,0,0,0,32.19-16.15h0C129.94,79.82,122.88,55.64,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60.55,31,53.88s5-11.8,11.43-11.8S53.89,47.16,53.87,53.88,48.7,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60.55,73.25,53.88s5-11.8,11.44-11.8S96.11,47.16,96.09,53.88,90.95,65.69,84.7,65.69Z"/></svg>') center/contain no-repeat;
            filter: drop-shadow(0 0 5px #ff0000);
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 15px;
            background: #000000;
            border-top: 2px solid #ff0000;
            color: #ff0000;
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 10;
            box-shadow: 0 -0 30px rgba(255, 0, 0, 0.5);
        }

        /* Clock and Weather displays */
        .info-bar {
            position: fixed;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 5;
            padding: 0 20px;
        }

        .info-box {
            background: #000000;
            border: 2px solid #ff0000;
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6),
                        inset 0 0 10px rgba(255, 0, 0, 0.1);
            backdrop-filter: blur(5px);
        }

        .info-label {
            font-size: 11px;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #ff0000;
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px #ff0000;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                max-width: 90vw;
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .discord-btn {
                font-size: 14px;
                padding: 12px 20px;
            }

            .info-bar {
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }

            .info-box {
                min-width: 120px;
            }
        }

    </style>
</head>
<body>

<!-- Background canvas for animations -->
<canvas id="background"></canvas>

<!-- Info bar with clock and weather -->
<div class="info-bar">
    <div class="info-box">
        <div class="info-label">⏰ Czas</div>
        <div class="info-value" id="clock">00:00:00</div>
    </div>
    <div class="info-box">
        <div class="info-label">🌡️ Pogoda</div>
        <div class="info-value" id="weather">Zima</div>
    </div>
</div>

<!-- Main content -->
<div class="container">
    <div class="logo-container">
        <img src="752B843F-01C8-4158-ACAD-EE49D15C7585.png" alt="AKADK Logo" class="logo-image">
    </div>
    
    <h1>AKADK STORE</h1>
    
    <p class="description">
        Dołącz do naszej społeczności na Discordzie
    </p>
    
    <a href="https://discord.gg/nq2zXQANyE" target="_blank" class="discord-btn">
        <div class="discord-icon"></div>
        <span>Przejdź na sklep</span>
    </a>
</div>

<!-- Footer -->
<footer>
    © Copyright AKADK × KRUPNICZEKK
</footer>

<script>
    // Canvas setup
    const canvas = document.getElementById('background');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];
    let weatherType = 'none';

    // Determine weather based on month
    function updateWeather() {
        const month = new Date().getMonth();
        const weatherEl = document.getElementById('weather');
        
        if (month >= 11 || month <= 2) {
            weatherType = 'snow';
            weatherEl.textContent = '❄️ Śnieg';
        } else if (month >= 5 && month <= 8) {
            weatherType = 'rain';
            weatherEl.textContent = '🌧️ Deszcz';
        } else {
            weatherType = 'autumn';
            weatherEl.textContent = '🍂 Jesień';
        }
    }

    // Clock update
    function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString('pl-PL');
        document.getElementById('clock').textContent = time;
    }

    // Particle system for weather
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height - canvas.height;
            this.size = Math.random() * 2 + 1;
            this.speedY = Math.random() * 2 + 1;
            this.speedX = weatherType === 'rain' ? (Math.random() - 0.5) * 1.5 : Math.random() - 0.5;
            this.opacity = Math.random() * 0.5 + 0.2;
        }

        update() {
            this.y += this.speedY;
            this.x += this.speedX;

            if (this.y > canvas.height) {
                this.y = -this.size;
                this.x = Math.random() * canvas.width;
            }

            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
        }

        draw() {
            if (weatherType === 'snow') {
                ctx.fillStyle = `rgba(200, 200, 200, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowColor = `rgba(255, 0, 0, ${this.opacity * 0.5})`;
                ctx.shadowBlur = 5;
            } else if (weatherType === 'rain') {
                ctx.strokeStyle = `rgba(100, 150, 255, ${this.opacity})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.speedX, this.y - this.speedY * 5);
                ctx.stroke();
                ctx.shadowColor = `rgba(255, 0, 0, ${this.opacity * 0.3})`;
                ctx.shadowBlur = 3;
            } else if (weatherType === 'autumn') {
                ctx.globalAlpha = this.opacity;
                ctx.font = '16px Arial';
                ctx.fillText('🍂', this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }
    }

    // Initialize particles
    function initParticles() {
        particles = [];
        if (weatherType !== 'none') {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle());
            }
        }
    }

    // Animation loop
    function animate() {
        // Clear canvas
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw particles
        particles.forEach(particle => {
            particle.update();
            particle.draw();
        });

        requestAnimationFrame(animate);
    }

    // Window resize handler
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    // Update clock every second
    setInterval(updateClock, 1000);

    // Initialize
    updateClock();
    updateWeather();
    initParticles();
    animate();

</script>

</body>
</html>
